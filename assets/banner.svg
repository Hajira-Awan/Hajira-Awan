<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" width="1000" height="280" role="img" aria-label="Profile banner">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#070b1a"/>
      <stop offset="0.6" stop-color="#151b45"/>
      <stop offset="1" stop-color="#3b1f5e"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#fbbf24"/>
    </linearGradient>
    <style>
      .tw{animation:tw 3s ease-in-out infinite}
      .tw2{animation:tw 4.5s ease-in-out infinite 1s}
      .tw3{animation:tw 2.4s ease-in-out infinite .5s}
      @keyframes tw{0%,100%{opacity:.2}50%{opacity:1}}
      .name{font:800 76px 'Courier New',monospace;letter-spacing:6px}
      .sub{font:600 20px 'Courier New',monospace;letter-spacing:3px}
      .tag{font:500 14px 'Courier New',monospace;letter-spacing:2px}
      .fade{animation:fade 1.6s ease-out both}
      @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
    </style>
  </defs>
  <rect width="1000" height="280" fill="url(#sky)"/>
  <g fill="#e2e8f0">
    <circle class="tw" cx="80" cy="40" r="2"/><circle class="tw2" cx="190" cy="85" r="1.6"/>
    <circle class="tw3" cx="320" cy="30" r="2"/><circle class="tw" cx="450" cy="62" r="1.4"/>
    <circle class="tw2" cx="590" cy="35" r="2"/><circle class="tw3" cx="720" cy="78" r="1.6"/>
    <circle class="tw" cx="850" cy="40" r="2"/><circle class="tw2" cx="930" cy="100" r="1.4"/>
    <circle class="tw3" cx="140" cy="140" r="1.4"/><circle class="tw" cx="880" cy="150" r="1.6"/>
  </g>
  <circle cx="900" cy="62" r="26" fill="#fbbf24" opacity=".95"/>
  <circle cx="910" cy="55" r="24" fill="#151b45"/>
  <polygon points="0,280 0,200 90,150 170,205 270,130 380,210 480,160 590,215 700,140 800,205 900,165 1000,210 1000,280" fill="#0d1230"/>
  <polygon points="0,280 0,235 110,205 220,240 340,200 460,245 580,215 700,250 830,210 940,245 1000,230 1000,280" fill="#080b1f"/>
  <g class="fade">
    <text x="500" y="128" text-anchor="middle" class="name" fill="url(#glow)">YOUR NAME</text>
    <text x="500" y="168" text-anchor="middle" class="sub" fill="#e2e8f0">DEVELOPER · BUILDER · EXPLORER</text>
    <text x="500" y="200" text-anchor="middle" class="tag" fill="#94a3b8">CURRENTLY: BUILDING SOMETHING WORTH SHIPPING</text>
  </g>
</svg>
