<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" width="1000" height="330" role="img" aria-label="whoami terminal card">
  <defs>
    <style>
      .bg{fill:#0b1220;stroke:#1e3a5f;stroke-width:2}
      .bar{fill:#111a2e}
      .m{font:500 17px 'Courier New',monospace}
      .k{fill:#5eead4}
      .v{fill:#e2e8f0}
      .p{fill:#fbbf24}
      .dim{fill:#64748b}
      .cur{animation:blink 1s steps(1) infinite}
      @keyframes blink{50%{opacity:0}}
      .line{opacity:0;animation:in .4s ease-out forwards}
      .l1{animation-delay:.2s}.l2{animation-delay:.5s}.l3{animation-delay:.8s}
      .l4{animation-delay:1.1s}.l5{animation-delay:1.4s}.l6{animation-delay:1.7s}.l7{animation-delay:2s}
      @keyframes in{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:none}}
    </style>
  </defs>
  <rect class="bg" x="1" y="1" width="998" height="328" rx="12"/>
  <rect class="bar" x="1" y="1" width="998" height="38" rx="12"/>
  <circle cx="26" cy="20" r="6" fill="#f87171"/><circle cx="48" cy="20" r="6" fill="#fbbf24"/><circle cx="70" cy="20" r="6" fill="#4ade80"/>
  <text x="500" y="26" text-anchor="middle" class="m dim" style="font-size:14px">Hajira-Awan@github: ~/about</text>

  <text x="30" y="75" class="m p line l1">Hajira-Awan@github:~$ <tspan class="v">whoami</tspan></text>

  <g class="m">
    <text x="30"  y="112" class="k line l2">NAME</text>   <text x="180" y="112" class="v line l2">Hajira Awan</text>
    <text x="30"  y="142" class="k line l3">ROLE</text>   <text x="180" y="142" class="v line l3">Student / Developer / Designer </text>
    <text x="30"  y="172" class="k line l4">STATUS</text> <text x="180" y="172" class="v line l4"><tspan fill="#4ade80">●</tspan> Open to opportunities</text>
    <text x="30"  y="202" class="k line l5">STACK</text>  <text x="180" y="202" class="v line l5"> C++ · Python · TypeScript · React · SQL </text>
    <text x="30"  y="232" class="k line l7">FOCUS</text>  <text x="180" y="232" class="v line l7">AI · Web · Open source</text>
  </g>
  <text x="30" y="305" class="m p">you@github:~$ <tspan class="cur v">█</tspan></text>
</svg>
